<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Sayfa Bulunamadı | Vargeloğlu İnşaat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #0a0d12;
      color: #e8eaf0;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .nf { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .nf-code {
      font-family: Georgia, serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      color: #C9A84C;
      opacity: 0.2;
      line-height: 1;
    }
    .nf-title {
      font-family: Georgia, serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .nf-desc {
      font-size: 1rem;
      color: #8a9ab0;
      max-width: 40ch;
      line-height: 1.7;
      margin: 0;
    }
    .nf-btn {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      height: 50px;
      padding: 0 32px;
      border-radius: 6px;
      background: #C9A84C;
      color: #0a0d12;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .nf-btn:hover { background: #e2c06e; transform: translateY(-2px); }
    .nf-btn:focus-visible { outline: 2px solid #e2c06e; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="nf">
    <span class="nf-code" aria-hidden="true">404</span>
    <h1 class="nf-title" id="nf-title">Sayfa Bulunamadı</h1>
    <p class="nf-desc" id="nf-desc">Aradığınız sayfa mevcut değil veya taşınmış olabilir.</p>
    <a class="nf-btn" id="nf-btn" href="/">Ana Sayfaya Dön</a>
  </main>

  <script>
    (function () {
      var KEY = 'locale';
      var copy = {
        tr: {
          lang: 'tr',
          title: 'Sayfa Bulunamadı',
          desc: 'Aradığınız sayfa mevcut değil veya taşınmış olabilir.',
          btn: 'Ana Sayfaya Dön'
        },
        en: {
          lang: 'en',
          title: 'Page Not Found',
          desc: 'The page you are looking for does not exist or may have been moved.',
          btn: 'Back to Home'
        }
      };
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
      var c = copy[saved === 'en' ? 'en' : 'tr'];
      document.documentElement.lang = c.lang;
      document.title = c.title + ' | Vargeloğlu İnşaat';
      document.getElementById('nf-title').textContent = c.title;
      document.getElementById('nf-desc').textContent = c.desc;
      document.getElementById('nf-btn').textContent = c.btn;
    })();
  </script>
</body>
</html>
